# MAN (man-grub): the start-up screen (Plymouth theme "man") instead of text,
# in the screen mode GRUB already uses (no flicker between them).
# The options themselves are set by /etc/grub.d/06_man_bootmenu at start-up
# ($man_quiet: quiet with the logo, or the start-up text when DUHACH!'s
# "Show start-up messages" is on).
GRUB_CMDLINE_LINUX_DEFAULT='$man_quiet'
GRUB_GFXPAYLOAD_LINUX=keep
