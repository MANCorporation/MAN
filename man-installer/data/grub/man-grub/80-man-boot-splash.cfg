# MAN (man-grub): the start-up screen (Plymouth theme "man") instead of text,
# in the screen mode GRUB already uses (no flicker between them).
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0"
GRUB_GFXPAYLOAD_LINUX=keep
