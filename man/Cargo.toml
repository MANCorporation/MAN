[package]
name = "man"
version = "0.1.0"
edition = "2021"
description = "MAN Linux distribution orchestrator — builds, tests, and packages the MAN Linux distribution"
license-file = "../LICENSES/LicenseRef-MAN-Proprietary.txt"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
colored = "2"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
which = "5"

[[bin]]
name = "man"
path = "src/main.rs"
