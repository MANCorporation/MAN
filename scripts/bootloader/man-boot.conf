# MAN Boot Manager — minimal visual configuration.
#
# This file is the SINGLE SOURCE OF TRUTH for all boot configurations.
# The scripts create-efi-disk.sh, create-uefi-iso.sh, and man-install
# all derive their refind.conf from this template by substituting:
#   @KERNEL_NAME@       — "Image" (aarch64) or "vmlinuz" (x86-64)
#   @SERIAL_CONSOLE@    — "ttyAMA0,115200" (aarch64) or "ttyS0,115200" (x86-64)
#   @ROOT_DEVICE@       — "PARTUUID=<id>" (installed) or a development device

# Auto-boot after 3 seconds (fast, but enough to choose)
timeout 3

# Default boot entry
default_selection "MAN"

# Only show manually defined boot entries
scanfor manual

# Resolution: use the firmware's highest available mode
resolution max

# Solid-black banner (replaces rEFInd's default logo for a clean look)
banner \EFI\BOOT\theme\man-background.png
banner_scale fillscreen

# Smaller icons for a cleaner, less cluttered appearance
big_icon_size 512
small_icon_size 128

# Hide all UI chrome except element labels (so entries remain readable)
hideui arrows,hints,badges,editor

# Hide all built-in tools (Shell, Firmware Setup, etc.) — unused on MAN
showtools

# Preserve the firmware framebuffer for the kernel handoff.  In particular,
# do not pass video=efifb:off: on machines where the native DRM driver is not
# ready yet, disabling efifb leaves the installed system with no visible
# console and appears as a permanent black screen.
use_graphics_for linux

# ---------------------------------------------------------------------------
# Boot entry: MAN Linux (normal boot)
# ---------------------------------------------------------------------------
menuentry "MAN" {
    loader \EFI\BOOT\@KERNEL_NAME@
    options "console=tty0 console=@SERIAL_CONSOLE@ net.ifnames=0 root=@ROOT_DEVICE@ rw rootwait quiet loglevel=1 vt.global_cursor_default=0"
    ostype Linux
    icon \EFI\BOOT\theme\man-system.png
}

# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Boot entry: MAN Recovery (loaded into RAM)
# ---------------------------------------------------------------------------
menuentry "MAN Recovery" {
    loader \EFI\BOOT\@KERNEL_NAME@
    initrd \EFI\BOOT\man-recovery.cpio.gz
    options "console=tty0 console=@SERIAL_CONSOLE@ rdinit=/sbin/init rw quiet loglevel=1 vt.global_cursor_default=0 net.ifnames=0 man.recovery=1"
    ostype Linux
    icon \EFI\BOOT\theme\man-recovery.png
}
