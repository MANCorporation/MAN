# MAN live ISO boot menu (UEFI and BIOS). make-iso.sh fills in @ID@ and
# @CONSOLE@ (the serial port: ttyS0 on x86-64, ttyAMA0 on ARM64).
insmod part_gpt
insmod part_msdos
insmod iso9660
insmod fat
insmod btrfs
insmod ext2
insmod search_fs_file
insmod search_label
insmod all_video
insmod gfxterm
insmod png
loadfont $prefix/fonts/unicode.pf2
set gfxmode=auto
terminal_output gfxterm
# This medium; $root may change when an installed MAN's menu is read.
set live=$root
set live_opts="man.id=@ID@ @CONSOLE@ console=tty0 loglevel=4"

# An installed MAN is started by default, so a forgotten USB stick or disc
# does not restart the live session after installing. Encrypted installs
# keep GRUB's files on the MAN_BOOT partition, plain ones inside @system.
set installed=
set installed_grub=
if search --no-floppy --label MAN_BOOT --set=installed; then
    set installed_grub=/grub
elif search --no-floppy --file /@system/boot/grub/grub.cfg --set=installed; then
    set installed_grub=/@system/boot/grub
fi
if [ -n "$installed" ]; then
    # Its one-time entry (a MAN update's "Install MAN update", grub-reboot) is in
    # its own grubenv; that menu reads $prefix/grubenv, which is this medium's
    # here, so read it for it and clear it as GRUB would after one use.
    insmod loadenv
    set man_next=
    if [ -s ($installed)$installed_grub/grubenv ]; then
        load_env --file ($installed)$installed_grub/grubenv next_entry
        if [ -n "$next_entry" ]; then
            set man_next=$next_entry
            set next_entry=
            save_env --file ($installed)$installed_grub/grubenv next_entry
        fi
    fi
    # Its own menu (snapshots, default entry, countdown); the live session
    # is offered below it. Modules keep loading from this medium.
    set root=$installed
    source ($installed)$installed_grub/grub.cfg
    if [ -n "$man_next" ]; then
        set default=$man_next
    fi
else
    set default=live
    set timeout=5
    set timeout_style=menu
fi

menuentry "Try or Install MAN" --id live {
    echo "Starting MAN..."
    linux ($live)/live/vmlinuz $live_opts
    initrd ($live)/live/initrd.img
}
menuentry "Try or Install MAN (copy to memory)" --id live-toram {
    echo "Starting MAN and copying it into memory (this takes a while)..."
    linux ($live)/live/vmlinuz $live_opts toram
    initrd ($live)/live/initrd.img
}
menuentry "Try or Install MAN (safe graphics)" --id live-safe {
    echo "Starting MAN with basic graphics..."
    linux ($live)/live/vmlinuz $live_opts nomodeset
    initrd ($live)/live/initrd.img
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI Firmware Settings" --id uefi-firmware {
        fwsetup
    }
fi
