# MAN live ISO boot menu (UEFI and BIOS). make-iso.sh fills in @ID@ and
# @CONSOLE@ (the serial port: ttyS0 on x86-64, ttyAMA0 on ARM64).
# Started from the stick, MAN's boot menu always shows: the picker (a row of
# icons, see /etc/grub.d/06_man_bootmenu on MAN) with "Try or Install MAN";
# Shift+Enter on it shows the list with the other ways to start the stick.
insmod part_gpt
insmod part_msdos
insmod iso9660
insmod fat
insmod btrfs
insmod ext2
insmod search_fs_file
insmod search_label
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod regexp
insmod keystatus
insmod loadenv
loadfont $prefix/fonts/unicode.pf2
set gfxmode=auto
terminal_output gfxterm
# This medium; $root may change when an installed MAN's menu is read.
set live=$root
set live_opts="man.id=@ID@ @CONSOLE@ console=tty0 quiet splash loglevel=3 systemd.show_status=false vt.global_cursor_default=0"
set man_iso_cfg="$prefix/grub.cfg"
set man_live_root="$live"
export live
export live_opts
export man_live_root
export man_iso_cfg

# "Try or Install MAN" in the picker (also in an installed MAN's picker,
# which calls this). Shift+Enter: the list with the other ways to start.
function man_iso_entries {
    menuentry "Try or Install MAN" --class usb-man --class usb --id live {
        if [ "$menu_mod" = shift ]; then
            set man_view=list
            set man_boot=
            export man_view
            export man_boot
            configfile "$man_iso_cfg"
        else
            linux ($live)/live/vmlinuz $live_opts
            initrd ($live)/live/initrd.img
        fi
    }
}

# An installed MAN is started by default, so a forgotten USB stick or disc
# does not restart the live session after installing. Encrypted installs
# keep GRUB's files on the MAN_BOOT partition, plain ones inside @system.
# Chosen as "MAN Live" in an installed MAN's picker (man_live_pick): the
# live session starts straight away.
set installed=
set installed_grub=
if [ -z "$man_live_pick" ]; then
    if search --no-floppy --label MAN_BOOT --set=installed; then
        set installed_grub=/grub
    elif search --no-floppy --file /@system/boot/grub/grub.cfg --set=installed; then
        set installed_grub=/@system/boot/grub
    fi
fi
set man_old_menu=
if [ -n "$installed" ]; then
    # Its one-time entry (a MAN update's "Install MAN update", grub-reboot) is in
    # its own grubenv; that menu reads $prefix/grubenv, which is this medium's
    # here, so read it for it and clear it as GRUB would after one use.
    set man_next=
    if [ -z "$man_boot" -a -s ($installed)$installed_grub/grubenv ]; then
        load_env --file ($installed)$installed_grub/grubenv next_entry
        if [ -n "$next_entry" ]; then
            set man_next=$next_entry
            set next_entry=
            save_env --file ($installed)$installed_grub/grubenv next_entry
        fi
    fi
    if [ -n "$man_next" ]; then set man_boot="$man_next"; fi
    # Its own menu (snapshots, Windows, the picker); the live session is added
    # below. Choosing in the picker reads this file again (man_cfg).
    set man_cfg="$man_iso_cfg"
    set man_force_picker=1
    set man_force_timeout=5
    set root=$installed
    source ($installed)$installed_grub/grub.cfg
    if [ -z "$man_theme_dir" ]; then
        # A MAN from before the picker: its plain list, live entries below.
        set man_old_menu=1
        if [ -n "$man_next" ]; then set default=$man_next; fi
        set timeout=5
        set timeout_style=menu
    fi
else
    for f in ($live)/boot/grub/themes/man/*.pf2; do loadfont "$f"; done
    set man_theme_dir=($live)/boot/grub/themes/man
    if [ "$man_view" = list ]; then
        set theme="$man_theme_dir/advanced.txt"
        set menu_layout=
        set default=live
        set timeout=-1
        set timeout_style=menu
    else
        set man_view=picker
        set theme="$man_theme_dir/theme.txt"
        set menu_layout=horizontal
        set default=live
        if [ -n "$man_live_pick" ]; then
            set timeout=0
            set timeout_style=hidden
        else
            set timeout=5
            set timeout_style=menu
        fi
    fi
fi

if [ "$man_view" = picker ]; then
    man_iso_entries
else
    menuentry "Try or Install MAN" --class usb-man --class usb --id live {
        linux ($live)/live/vmlinuz $live_opts
        initrd ($live)/live/initrd.img
    }
    menuentry "Try or Install MAN (copy to memory)" --class usb-man --class usb --id live-toram {
        echo "Starting MAN and copying it into memory (this takes a while)..."
        linux ($live)/live/vmlinuz $live_opts toram
        initrd ($live)/live/initrd.img
    }
    menuentry "Try or Install MAN (safe graphics)" --class usb-man --class usb --id live-safe {
        linux ($live)/live/vmlinuz $live_opts nomodeset plymouth.enable=0
        initrd ($live)/live/initrd.img
    }
    if [ -z "$installed" -o -n "$man_old_menu" ]; then
        if [ "$grub_platform" = "efi" ]; then
            menuentry "UEFI Firmware Settings" --class firmware --id uefi-firmware {
                fwsetup
            }
        fi
    fi
fi
