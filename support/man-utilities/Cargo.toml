[package]
name = "man-utilities"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSES/LicenseRef-MAN-Proprietary.txt"
autobins = false

[[bin]]
name = "man-utilities"
path = "src/main.rs"

[[bin]]
name = "man-guide"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "c1897c01aa8a25776ceadeddcb161bb59ccffd79"
default-features = false
features = ["tokio", "winit", "wayland", "wgpu"]

[profile.release]
lto = "thin"
